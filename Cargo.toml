[package]
name = "shiguredo_svt_av1"
version = "2026.1.0"
edition = "2024"
rust-version = "1.88"
description = "Rust bindings for SVT-AV1"
readme = "README.md"
homepage = "https://github.com/shiguredo/svt-av1-rs"
repository = "https://github.com/shiguredo/svt-av1-rs"
license = "Apache-2.0"
build = "build.rs"
include = ["/LICENSE", "/README.md", "/build.rs", "/src/**/*"]

# 以降は外部ライブラリビルド用のメタデータ
# (この内容は build.rs の中からのみ参照される)
[package.metadata.external-dependencies]
SVT-AV1 = { url = "https://gitlab.com/AOMediaCodec/SVT-AV1", version = "v4.1.0" }

[dependencies]
log = "0.4"

[dev-dependencies]
shiguredo_aom = "2026.1"
shiguredo_dav1d = "2026.1"

[build-dependencies]
bindgen = "0.72"
shiguredo_cmake = "4.3"
shiguredo_toml = "2026.2"

[features]
source-build = []
