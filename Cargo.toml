[package]
name = "shiguredo_svt_av1"
version = "2026.2.0-canary.0"
edition = "2024"
rust-version = "1.93"
description = "Rust bindings for SVT-AV1"
readme = "README.md"
homepage = "https://github.com/shiguredo/svt-av1-rs"
repository = "https://github.com/shiguredo/svt-av1-rs"
license = "Apache-2.0"
build = "build.rs"
include = ["/LICENSE", "/README.md", "/build.rs", "/src/**/*"]

# 以降は外部ライブラリビルド用のメタデータ
# (この内容は build.rs の中からのみ参照される)
[package.metadata.external-dependencies.SVT-AV1]
url = "https://gitlab.com/AOMediaCodec/SVT-AV1"
version = "v4.2.0"

[dependencies]
# ログ出力に使用する
log = "0.4"

[dev-dependencies]
# PSNR テストで aom によるデコードに使用する
shiguredo_aom = "2026.2.0-canary.5"
# PSNR テストで dav1d によるデコードに使用する
shiguredo_dav1d = "2026.2"

[build-dependencies]
# SVT-AV1 の C ヘッダから Rust バインディングを生成する
bindgen = "0.72"
# SVT-AV1 の CMake ビルドに使用する
shiguredo_cmake = "4.4"
# Cargo.toml の外部依存メタデータをパースする
shiguredo_toml = "2026.2"

[features]
source-build = []
